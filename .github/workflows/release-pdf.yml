name: Build and Release Templates

on:
  push:
    tags:
      - 'first-v*'
      - 'report-v*'
      - 'second-v*'
      - 'zero-v*'

permissions:
  contents: write

jobs:
  build-first:
    if: startsWith(github.ref, 'refs/tags/first-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile First Review
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Presentations/First Review/ # Specify project subfolder
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Presentations/First Review/main.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-report:
    if: startsWith(github.ref, 'refs/tags/report-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Report
        uses: xu-cheng/latex-action@v4
        with:
          root_file: project_report.tex
          working_directory: Presentations/Report # Specify project subfolder
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Presentations/Report/project_report.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-second:
    if: startsWith(github.ref, 'refs/tags/second-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Second Interim
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Presentations/Second Interim # Specify project subfolder
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Presentations/Second Interim/main.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  build-zero:
    if: startsWith(github.ref, 'refs/tags/zero-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Zeroth Review
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Presentations/Zeroth Review # Specify project subfolder
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Presentations/Zeroth Review/main.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}