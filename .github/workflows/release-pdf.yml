name: Build and Release Templates

on:
  push:
    tags:
      - 'first-v*'
      - 'report-v*'
      - 'second-v*'
      - 'zero-v*'

permissions:
  contents: write

jobs:
  build-resume:
    if: startsWith(github.ref, 'refs/tags/first-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Resume
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Presentations/First Review/ # Specify project subfolder
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Presentations/First Review/main.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-report:
    if: startsWith(github.ref, 'refs/tags/report-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Report
        uses: xu-cheng/latex-action@v4
        with:
          root_file: report.tex
          working_directory: templates/report # Specify project subfolder
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: templates/report/report.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}